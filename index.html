<script>
  // UNREGISTER OLD SERVICE WORKERS ON MOBILE TO ALWAYS SERVE FRESH CODE
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) { registration.unregister() }
      });
    }
    const searchParams = new URLSearchParams(window.location.search);
    if (
      window.location.hash.includes('dev') ||
      searchParams.get('admin') !== null ||
      searchParams.get('dev') !== null ||
      searchParams.get('bypass') !== null ||
      window.location.pathname.startsWith('/dev')
    ) {
      localStorage.setItem('DEV_BYPASS_AUTH', 'true');
      localStorage.setItem('DEV_ADMIN_BYPASS', 'true');
    }
  } catch (e) {}
</script>
