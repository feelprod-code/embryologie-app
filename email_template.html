<!DOCTYPE html>
<html lang="fr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!--[if !mso]><!-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap');
  </style>
  <!--<![endif]-->
  <title>Votre code d'accès - Embryologie Biodynamique</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FAF6ED; font-family: 'Inter', Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FAF6ED; padding: 20px 0;">
    <tr>
      <td align="center">
        <!-- Conteneur Principal Beige clair (#FAF6ED) -->
        <table width="100%" max-width="500" cellpadding="0" cellspacing="0" border="0" style="max-width: 500px; background-color: #FAF6ED; border-radius: 16px; overflow: hidden; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
          <tr>
            <td align="center" style="padding: 40px 20px;">

              <!-- TEXTE INTRODUCTIF DEMANDÉ -->
              <h2 style="margin: 0 0 24px 0; font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 700; color: #334155; text-align: center;">
                Confirmez votre inscription<br>à l'Embryologie Biodynamique
              </h2>

              <!-- LOGO GRAND FORMAT SANS RELIEF -->
              <img src="https://media.licdn.com/dms/image/v2/C4E03AQElg8Z6-5E13A/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1516629160577?e=1740009600&v=beta&t=3sD_0K_yT_l3_j_14-i_-_P_D_4" width="165" alt="Logo Embryologie" style="width: 33%; max-width: 165px; height: auto; display: block; border: 0; margin-bottom: 24px; outline: none; background: transparent; border-radius: 50%;">

              <!-- Titre principal GRIS FONCÉ EN GRAS (Police Anton) -->
              <h1 style="margin: 0 0 5px 0; font-family: 'Anton', 'Arial Black', Impact, sans-serif; font-size: 38px; font-weight: 400; color: #334155; text-transform: uppercase; letter-spacing: 1px; line-height: 1;">
                L'EMBRYOLOGIE
              </h1>
              
              <!-- Sous-titre ORANGE -->
              <h1 style="margin: 0 0 10px 0; font-family: 'Anton', 'Arial Black', Impact, sans-serif; font-size: 34px; font-weight: 400; color: #F27D33; text-transform: uppercase; letter-spacing: 1px; line-height: 1;">
                BIODYNAMIQUE
              </h1>

              <!-- Auteur juste sous le titre -->
              <p style="margin: 0 0 24px 0; font-family: 'Inter', Arial, sans-serif; font-size: 13px; color: #64748b; line-height: 1.4; font-weight: 500;">
                par Marc Damoiseaux, Ostéopathe D.O
              </p>

              <!-- Texte d'instruction retiré ici car mis en haut : Voici votre code... -->

              <!-- Bloc contenant le Code OTP -->
              <table cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 320px; margin-bottom: 24px; box-shadow: 0 2px 4px -1px rgba(0,0,0,0.05);">
                <tr>
                  <td align="center" style="padding: 24px 10px;">
                    <!-- CODE EN BLEU INITIAL AVEC BEAUCOUP D'ESPACE -->
                    <span style="font-family: 'Inter', Arial, sans-serif; font-size: 36px; font-weight: 700; color: #4171b5; letter-spacing: 12px; text-decoration: underline; text-decoration-color: #4171b5; margin-left:12px;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Texte d'instruction -->
              <p style="margin: 0 0 32px 0; font-family: 'Inter', Arial, sans-serif; font-size: 13px; color: #64748b; line-height: 1.5; padding: 0 20px;">
                Saisissez ce code dans l'application pour valider votre connexion.
              </p>

              <!-- Ligne de séparation très claire -->
              <div style="border-top: 1px solid #e2e8f0; width: 80%; margin: 0 auto 24px;"></div>

              <!-- Footer -->
              <p style="margin: 0 0 6px 0; font-family: 'Bebas Neue', 'Arial Black', sans-serif; font-size: 15px; color: #94a3b8; letter-spacing: 1.5px; line-height: 1; text-transform: uppercase;">
                TECHNIQUES DOUCES TISSULAIRES
              </p>
              <p style="margin: 0; font-family: 'Inter', Arial, sans-serif; font-size: 11px; color: #cbd5e1; letter-spacing: 0.5px; line-height: 1; text-transform: uppercase;">
                RÉALISATION FEELPROD
              </p>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
